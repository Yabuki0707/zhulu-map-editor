<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《逐鹿》栅格地图编辑器</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<header>
  <div class="brand">逐鹿 · 栅格编辑器 <small id="srcNote"></small></div>

  <div class="seg" id="modeSeg" role="group" aria-label="模式（视图/编辑）">
    <button data-mode="view" title="视图：平移缩放、点选查看（V）">视图</button>
    <button data-mode="edit" aria-pressed="true" title="编辑：涂抹光标下的对象（E）">编辑</button>  </div>

  <!-- 单元条：三个可编辑的（写死）＋ 只读自然层（由 js/ro.js 的 RO_ORDER 生成，
       编辑模式下整组连分隔符一起隐藏 —— 自然层不属于编辑层）。 -->
  <div class="seg" id="unitSeg" role="group" aria-label="单元（三个可编辑单元 + 只读自然层）">
    <button data-unit="domain"  title="地域 · 编辑对象是地块（1）">地域</button>
    <button data-unit="plot"    aria-pressed="true" title="地块 · 编辑对象是栅格（2）">地块</button>
    <button data-unit="block"   title="块区 · 编辑对象是所属地块内的栅格（3）">块区</button>
    <span class="usep" id="roSep" role="presentation" hidden></span>
    <span id="roBtns" style="display:contents"></span>
  </div>

  <div class="brushbox" id="brushbox">
    <div class="pentog" id="pentog" role="radiogroup" aria-label="笔 / 橡皮">
      <span class="knob" id="penKnob"></span>
      <button class="tog" data-pen="1" role="radio" aria-checked="true" title="笔：写入当前对象（B）">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.2 19.8l4.1-1 8.9-8.9-3.1-3.1-8.9 8.9-1 4.1z"/>
          <path d="M14.9 5.1l1.6-1.6a1.9 1.9 0 0 1 2.7 0l1.3 1.3a1.9 1.9 0 0 1 0 2.7l-1.6 1.6-4-4z" opacity=".85"/>
          <path d="M4.2 19.8l1.5-4.6 3.1 3.1-4.6 1.5z" opacity=".55"/>
        </svg>
      </button>
      <button class="tog" data-pen="0" role="radio" aria-checked="false" title="橡皮：清掉当前对象（X）">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.4 4.3l6.3 6.3a1.9 1.9 0 0 1 0 2.7l-5.5 5.5H9.6l-3.9-3.9a1.9 1.9 0 0 1 0-2.7l5-5a1.9 1.9 0 0 1 2.7 0z"/>
          <path d="M8.4 18.8H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".75"/>
        </svg>
      </button>
    </div>
    <svg class="rslider" id="rslider" viewBox="0 0 132 24" width="132" height="24"
         role="slider" tabindex="0" aria-label="笔刷半径（格）"
         aria-valuemin="1" aria-valuemax="50" aria-valuenow="4">
      <defs>
        <linearGradient id="rfill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#d3a184"/><stop offset="1" stop-color="#8c2f23"/>
        </linearGradient>
      </defs>
      <rect x="9" y="10.5" width="114" height="3.2" rx="1.6" fill="#e2dccd"/>
      <rect id="rFill" x="9" y="10.5" width="0" height="3.2" rx="1.6" fill="url(#rfill)"/>
      <g id="rTicks" fill="#cfc7b6"></g>
      <circle id="rKnob" cx="9" cy="12" r="6.4" fill="#fffdf9" stroke="#8c2f23" stroke-width="1.6"/>
      <circle id="rDot" cx="9" cy="12" r="2.1" fill="#8c2f23"/>
    </svg>
    <b id="brushVal">4</b><span class="unit">格</span>
  </div>

  <div class="seg" role="group" aria-label="图层（参考）">
    <button id="ovTer"  aria-pressed="true"  title="地形底图（T）">地形</button>
    <button id="ovRef"  aria-pressed="false" title="参考：矢量顶点（汉地唐 741 州面／其余地区单元边界）（R）">参考</button>
    <button id="ovEdge" aria-pressed="false" title="地块边界线（P）">地块线</button>
    <button id="ovBEdge" aria-pressed="false" title="块区边界线（K）">块区线</button>
  </div>

  <span class="spacer"></span>
  <span class="staged" id="staged" hidden title=""></span>
  <span class="saved" id="saved"></span>
  <button class="tb ic" id="undo" title="撤销 Ctrl+Z">↶</button>
  <button class="tb ic" id="redo" title="重做 Ctrl+Shift+Z">↷</button>
  <button class="tb" id="fit" title="适应窗口 F">适应</button>
  <button class="tb ic" id="helpBtn" title="操作说明（H）">?</button>
  <details class="menu" id="menu">
    <summary title="更多（保存 / 导出 / 导入）">⋯</summary>
    <div class="menuBody">
      <button id="save">保存进度</button>
      <button id="stage">保存到待合入</button>
      <hr>
      <button id="expPng">导出地块编码 PNG</button>
      <button id="expDis">导出块区编码 PNG</button>
      <hr>
      <button id="expLed">导出地块台账 CSV</button>
      <button id="expBLed">导出块区台账 CSV</button>
      <hr>
      <button id="expJson">导出存档 JSON</button>
      <button id="importBtn">导入存档 JSON</button>
      <hr>
      <button id="chkParts">飞地 / 多连通块检查</button>
      <button id="resetBtn">清空本地存档</button>
      <input type="file" id="fileIn" accept=".json" hidden>
    </div>
  </details>
</header>

<div class="sp" id="sp1"></div>

<aside class="left">
  <div class="panel-h">
    <span id="leftTitle">地块</span>
    <span class="sub" id="leftSub"></span>
    <span class="spacer"></span>
    <button class="tb mini" id="leftAct" title="新建：按当前单元决定建什么，落点是右键选中的那一格">＋ 新建</button>
  </div>
  <div class="panel-b" id="leftBody"></div>
</aside>

<main>
  <canvas id="cv"></canvas>
  <div class="chip" id="chip" hidden></div>
  <div class="hint" id="hint"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="load" id="load">正在解码栅格…</div>
</main>

<aside class="right">
  <div class="panel-h"><span id="inspTitle">地块</span><span class="sub" id="inspSub"></span></div>
  <div class="panel-b" id="insp"></div>
</aside>

<div class="sp b" id="sp2"></div>

<footer>
  <span id="fZoom">—</span><span id="fCursor">—</span><span id="fCell">—</span><span id="fStat">—</span>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
